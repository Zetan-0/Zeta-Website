<!DOCTYPE html>
<html lang=" en">
<head>
    <meta charset="UTF-8">
    <title>Join Zeta Psi Alpha</title>
    <style>
        body {  font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 30px; margin: auto; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; } 
        input[type="submit"] { background: #6C1D2F; color: white; border: none; padding: 12px; margin-top: 20px; cursor: pointer; font-size: 16px; border-radius: 3px; } 
        nav { text-align: center; margin-bottom: 20px; } 
        nav a { color: #6C1D2F; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <nav><a href="/">&larr; Back to Home</a></nav>
    <div class="container">
        <h2>ZETA Recruitment Form</h2>
        <form action="/submit" method="POST">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Lynchburg Email:</label>
            <input type="email" id="email" name="email" required placeholder="username@lynchburg.edu">

            <label for="year">Academic Year:</label>
            <select id="year" name="year">
                <option value="Freshman">Freshman</option>
                <option value="Sophomore">Sophomore</option>
                <option value="Junior">Junior</option>
                <option value="Senior">Senior</option>
            </select>

            <label for="track">Primary Tech Interest:</label>
            <select id="track" name="track">
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="Backend Developer">Backend Developer</option>
                <option value="Cybersecurity Developer">Cybersecurity Developer</option>
                <option value="Project Leader">Project Leader</option>
                <option value="Principal of Finances/ Treasurer">Principal of Finance/ Treasuer</option>
                <option value="Principal of Operations/ Recruitment Leader">Principal of Operations/ Recruitment Leader</option>
                <option value="Principal of Technology/ Vice President">Principal of Technology/ Vice President</option>
            </select>

            <input type="submit" value="Submit Application">
        </form>
    </div>
</body>
</html>
